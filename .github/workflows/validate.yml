# Prueft das oeffentliche Repository bei jedem Push und jeder Freigabe so,
# wie HACS und Home Assistant es selbst pruefen (hassfest, HACS-Pruefung).
# Wird von hacs-export.sh nach .github/workflows/validate.yml kopiert.
name: Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
